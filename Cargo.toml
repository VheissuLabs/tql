[package]
name = "tql-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "app"
path = "app/mod.rs"

[[bin]]
name = "tql-rust"
path = "main.rs"

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
base64 = "0.22"
cbc = "0.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color", "string"] }
clap_complete = "4"
flate2 = "1.1.10"
getrandom = "0.3"
hmac = "0.12"
jiff = "0.2.37"
mysql = { version = "28.0.3", default-features = false, features = ["minimal", "rustls-tls-ring"] }
postgres = "0.19.14"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false }
tar = "0.4.46"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "1.1.6"
unicode-width = "0.2.2"
ureq = "3.4.2"
webpki-roots = "1"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
