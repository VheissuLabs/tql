name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for a dry run'
        required: false

permissions:
  contents: write

env:
  # Everything tql touches: three database drivers, encryption, http for the
  # ask, and the pieces Laravel expects to be there.
  EXTENSIONS: bcmath,ctype,curl,dom,fileinfo,filter,iconv,mbstring,mbregex,mysqlnd,openssl,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,phar,posix,session,simplexml,sockets,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zlib
  PHP_VERSION: '8.4'

jobs:
  phar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, mbstring
          # box writes the phar, which the default ini forbids.
          ini-values: phar.readonly=0
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: php tql app:build tql --build-version=${{ steps.version.outputs.version }} --no-interaction

      - name: Check it runs
        run: |
          chmod +x builds/tql
          ./builds/tql --version
          ./builds/tql list | grep -q 'mcp:start'

      - uses: actions/upload-artifact@v4
        with:
          name: phar
          path: builds/tql

  # A phar needs PHP on the machine. These do not: static-php-cli's micro is a
  # PHP interpreter with no dependencies, and a binary is that with the phar
  # appended to it.
  standalone:
    needs: phar
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            spc: spc-linux-x86_64
            asset: tql-linux-x86_64
          - runner: ubuntu-24.04-arm
            spc: spc-linux-aarch64
            asset: tql-linux-aarch64
          - runner: macos-15
            spc: spc-macos-aarch64
            asset: tql-macos-aarch64
          - runner: macos-15-intel
            spc: spc-macos-x86_64
            asset: tql-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: phar
          path: builds

      - name: Get the builder
        run: |
          curl -fsSL -o spc "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/${{ matrix.spc }}"
          chmod +x spc
          ./spc --version

      # The interpreter only changes when the extension list or the PHP version
      # does, so it is worth keeping between releases.
      - name: Name the interpreter for what goes into it
        id: interpreter
        run: echo "key=micro-${{ matrix.asset }}-${{ matrix.runner }}-php${PHP_VERSION}-$(printf '%s' "$EXTENSIONS" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the interpreter
        id: cache
        uses: actions/cache@v4
        with:
          path: buildroot/bin/micro.sfx
          key: ${{ steps.interpreter.outputs.key }}

      - name: Build the interpreter
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./spc doctor --auto-fix
          ./spc download --with-php=${{ env.PHP_VERSION }} --for-extensions="$EXTENSIONS" --prefer-pre-built
          ./spc build "$EXTENSIONS" --build-micro

      - name: Make the binary
        run: |
          cat buildroot/bin/micro.sfx builds/tql > ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - name: Check it runs, with no PHP in sight
        run: |
          ./${{ matrix.asset }} --version
          ./${{ matrix.asset }} list | grep -q 'mcp:start'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  packages:
    needs: standalone
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: tql-linux-*
          path: binaries
          merge-multiple: true

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the deb and the rpm, one per architecture
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          mkdir -p dist

          for arch in amd64 arm64; do
            case "$arch" in
              amd64) cp binaries/tql-linux-x86_64 dist/tql ;;
              arm64) cp binaries/tql-linux-aarch64 dist/tql ;;
            esac

            chmod +x dist/tql

            VERSION=${{ steps.version.outputs.version }} ARCH=$arch nfpm package \
              --config packaging/nfpm.yaml --packager deb --target dist/
            VERSION=${{ steps.version.outputs.version }} ARCH=$arch nfpm package \
              --config packaging/nfpm.yaml --packager rpm --target dist/
          done

          rm dist/tql

      - name: Check the deb holds a binary that needs nothing
        run: |
          dpkg-deb --contents dist/*amd64.deb | grep -q 'usr/bin/tql'
          ! dpkg-deb --info dist/*amd64.deb | grep -q 'Depends'

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist

  # Both of these need a one-time account setup, and skip themselves until the
  # secret is there: a tap repository for brew, an AUR account for pacman.
  recipes:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checksums for each binary
        id: sums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"

          for asset in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            curl -fsSL -o "tql-$asset" "$base/tql-$asset"
            echo "$(echo $asset | tr '-' '_')=$(sha256sum "tql-$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: A token that can write to the tap
        id: tap
        if: vars.TAP_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: VheissuLabs
          repositories: homebrew-tap

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ steps.tap.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_MACOS_ARM: ${{ steps.sums.outputs.macos_aarch64 }}
          SHA_MACOS_INTEL: ${{ steps.sums.outputs.macos_x86_64 }}
          SHA_LINUX_ARM: ${{ steps.sums.outputs.linux_aarch64 }}
          SHA_LINUX_INTEL: ${{ steps.sums.outputs.linux_x86_64 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo 'No tap app or HOMEBREW_TAP_TOKEN, skipping the tap.'
            exit 0
          fi

          sed -e "s/VERSION/$VERSION/g" \
              -e "s/SHA_MACOS_ARM/$SHA_MACOS_ARM/" \
              -e "s/SHA_MACOS_INTEL/$SHA_MACOS_INTEL/" \
              -e "s/SHA_LINUX_ARM/$SHA_LINUX_ARM/" \
              -e "s/SHA_LINUX_INTEL/$SHA_LINUX_INTEL/" \
              packaging/homebrew/tql.rb > /tmp/tql.rb

          git clone "https://x-access-token:$TAP_TOKEN@github.com/VheissuLabs/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/tql.rb /tmp/tap/Formula/tql.rb

          cd /tmp/tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/tql.rb
          git commit -m "tql $VERSION"
          git push

      - name: Update the AUR package
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_LINUX_INTEL: ${{ steps.sums.outputs.linux_x86_64 }}
          SHA_LINUX_ARM: ${{ steps.sums.outputs.linux_aarch64 }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo 'No AUR_SSH_KEY, skipping the AUR.'
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur'

          git clone ssh://aur@aur.archlinux.org/tql-bin.git /tmp/aur
          sed -e "s/VERSION/$VERSION/g" \
              -e "s/SHA_LINUX_INTEL/$SHA_LINUX_INTEL/" \
              -e "s/SHA_LINUX_ARM/$SHA_LINUX_ARM/" \
              packaging/aur/PKGBUILD > /tmp/aur/PKGBUILD

          cd /tmp/aur
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          docker run --rm -v /tmp/aur:/pkg -w /pkg archlinux:base-devel \
            sh -c 'useradd -m build && chown -R build /pkg && su build -c "makepkg --printsrcinfo" > .SRCINFO'
          sudo chown -R "$(id -u):$(id -g)" /tmp/aur
          git add PKGBUILD .SRCINFO
          git commit -m "tql $VERSION"
          git push

  publish:
    needs: [phar, standalone, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Name the phar for what it is
        run: mv release/tql release/tql.phar

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false

  verify:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/install.yml

  brew:
    needs: recipes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15

    steps:
      - name: Install from the tap and run it
        env:
          TAP_READY: ${{ vars.TAP_APP_ID || secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_READY" ]; then
            echo 'No tap app or HOMEBREW_TAP_TOKEN, so the tap was not updated; skipping.'
            exit 0
          fi

          brew install vheissulabs/tap/tql
          tql --version | tee /dev/stderr | grep -qF "${TAG#v}"
