name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One native build per platform. Linux binaries are static musl builds, so
  # the deb, the rpm and a bare download all need nothing else on the machine.
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: tql-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: tql-linux-aarch64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: tql-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Get the musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Read the version this builds
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      # The updater installs a download only when it says it is the version it
      # was published as, so a tag must match Cargo.toml.
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "${{ steps.version.outputs.version }}" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml ${{ steps.version.outputs.version }}"
            exit 1
          }

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/tql ${{ matrix.asset }}

      - name: Check it runs, and says what it is
        run: |
          ./${{ matrix.asset }} --version | tee /dev/stderr | grep -qx "Tql v${{ steps.version.outputs.version }}"
          ./${{ matrix.asset }} list | grep -q 'mcp:start'

      - name: Check the Linux binary needs nothing
        if: runner.os == 'Linux'
        run: file ${{ matrix.asset }} | tee /dev/stderr | grep -qE 'statically linked|static-pie linked'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  packages:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: tql-linux-*
          path: binaries
          merge-multiple: true

      - name: Read the version this builds
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Build the deb and the rpm, one per architecture
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          mkdir -p dist

          for arch in amd64 arm64; do
            case "$arch" in
              amd64) cp binaries/tql-linux-x86_64 dist/tql ;;
              arm64) cp binaries/tql-linux-aarch64 dist/tql ;;
            esac

            chmod +x dist/tql

            VERSION=${{ steps.version.outputs.version }} ARCH=$arch nfpm package \
              --config packaging/nfpm.yaml --packager deb --target dist/
            VERSION=${{ steps.version.outputs.version }} ARCH=$arch nfpm package \
              --config packaging/nfpm.yaml --packager rpm --target dist/
          done

          rm dist/tql

      - name: Check the deb holds a binary that needs nothing
        run: |
          dpkg-deb --contents dist/*amd64.deb | grep -q 'usr/bin/tql'
          ! dpkg-deb --info dist/*amd64.deb | grep -q 'Depends'

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist

  # Both of these need a one-time account setup, and skip themselves until the
  # secret is there: HOMEBREW_TAP_DEPLOY_KEY for the tap, AUR_SSH_KEY for pacman.
  recipes:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checksums for each binary
        id: sums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"

          for asset in linux-x86_64 linux-aarch64 macos-aarch64; do
            curl -fsSL -o "tql-$asset" "$base/tql-$asset"
            echo "$(echo $asset | tr '-' '_')=$(sha256sum "tql-$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: A token that can write to the tap
        id: tap
        if: vars.TAP_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: VheissuLabs
          repositories: homebrew-tap

      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP_TOKEN: ${{ steps.tap.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_MACOS_ARM: ${{ steps.sums.outputs.macos_aarch64 }}
          SHA_LINUX_ARM: ${{ steps.sums.outputs.linux_aarch64 }}
          SHA_LINUX_INTEL: ${{ steps.sums.outputs.linux_x86_64 }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ] && [ -z "$TAP_TOKEN" ]; then
            echo 'No HOMEBREW_TAP_DEPLOY_KEY, tap app or HOMEBREW_TAP_TOKEN, skipping the tap.'
            exit 0
          fi

          sed -e "s/VERSION/$VERSION/g" \
              -e "s/SHA_MACOS_ARM/$SHA_MACOS_ARM/" \
              -e "s/SHA_LINUX_ARM/$SHA_LINUX_ARM/" \
              -e "s/SHA_LINUX_INTEL/$SHA_LINUX_INTEL/" \
              packaging/homebrew/tql.rb > /tmp/tql.rb

          if [ -n "$TAP_DEPLOY_KEY" ]; then
            install -m 600 /dev/null ~/tap_key
            printf '%s\n' "$TAP_DEPLOY_KEY" > ~/tap_key
            export GIT_SSH_COMMAND="ssh -i $HOME/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git clone git@github.com:VheissuLabs/homebrew-tap.git /tmp/tap
          else
            git clone "https://x-access-token:$TAP_TOKEN@github.com/VheissuLabs/homebrew-tap.git" /tmp/tap
          fi
          mkdir -p /tmp/tap/Formula
          cp /tmp/tql.rb /tmp/tap/Formula/tql.rb

          cd /tmp/tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/tql.rb
          git commit -m "tql $VERSION"
          git push

      - name: Update the AUR package
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_LINUX_INTEL: ${{ steps.sums.outputs.linux_x86_64 }}
          SHA_LINUX_ARM: ${{ steps.sums.outputs.linux_aarch64 }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo 'No AUR_SSH_KEY, skipping the AUR.'
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur'

          git clone ssh://aur@aur.archlinux.org/tql-bin.git /tmp/aur
          sed -e "s/VERSION/$VERSION/g" \
              -e "s/SHA_LINUX_INTEL/$SHA_LINUX_INTEL/" \
              -e "s/SHA_LINUX_ARM/$SHA_LINUX_ARM/" \
              packaging/aur/PKGBUILD > /tmp/aur/PKGBUILD

          cd /tmp/aur
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          docker run --rm -v /tmp/aur:/pkg -w /pkg archlinux:base-devel \
            sh -c 'useradd -m build && chown -R build /pkg && su build -c "makepkg --printsrcinfo" > .SRCINFO'
          sudo chown -R "$(id -u):$(id -g)" /tmp/aur
          git add PKGBUILD .SRCINFO
          git commit -m "tql $VERSION"
          git push

  publish:
    needs: [build, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: A PKGBUILD for this release, so Arch can makepkg it without the AUR
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sed -e "s/VERSION/${TAG#v}/g" \
              -e "s/SHA_LINUX_INTEL/$(sha256sum release/tql-linux-x86_64 | cut -d' ' -f1)/" \
              -e "s/SHA_LINUX_ARM/$(sha256sum release/tql-linux-aarch64 | cut -d' ' -f1)/" \
              packaging/aur/PKGBUILD > release/PKGBUILD

      - name: Checksums for every file in the release
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false

  verify:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/install.yml

  brew:
    needs: recipes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15

    steps:
      - name: Install from the tap and run it
        env:
          TAP_READY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY || vars.TAP_APP_ID || secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_READY" ]; then
            echo 'No tap credential, so the tap was not updated; skipping.'
            exit 0
          fi

          brew install vheissulabs/tap/tql
          tql --version | tee /dev/stderr | grep -qF "${TAG#v}"
