name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]

    runs-on: ${{ matrix.runner }}

    name: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # The live database, SSH and PHP parity tests are ignored here; they need
      # servers and a tql checkout that a runner does not have.
      - name: Run the suite
        run: cargo test --locked
