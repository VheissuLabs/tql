# Builds the .deb, the .rpm and the Arch package attached to each release.
#
#   VERSION=0.3.0 ARCH=amd64 nfpm package --config packaging/nfpm.yaml --packager deb
#
# install.sh installs the Arch one with pacman, so its file name,
# tql-<version>-1-<arch>.pkg.tar.zst, is part of the installer.
#
# dist/tql is the standalone binary for that architecture, so the package is
# one file and nothing else.
name: tql
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: database
priority: optional
maintainer: VheissuLabs <karl@notarydash.com>
description: |
  A database client for the terminal.
  Browse, filter, sort and edit MySQL, Postgres, SQL Server and SQLite from a
  full-screen terminal interface that always shows the SQL behind the view.
vendor: VheissuLabs
homepage: https://github.com/VheissuLabs/tql
license: MIT

contents:
  - src: ./dist/tql
    dst: /usr/bin/tql
    file_info:
      mode: 0755

# No dependencies at all: the binary is self-contained.

# tql-bin is the AUR package and the release PKGBUILD, which install the same file.
overrides:
  archlinux:
    conflicts:
      - tql-bin
