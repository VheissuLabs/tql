# Builds the .deb and the .rpm attached to each release.
#
#   VERSION=0.3.0 ARCH=amd64 nfpm package --config packaging/nfpm.yaml --packager deb
#
# dist/tql is the standalone binary for that architecture, so the package is
# one file and nothing else.
name: tql
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: database
priority: optional
maintainer: VheissuLabs <karl@notarydash.com>
description: |
  A database client for the terminal.
  Browse, filter, sort and edit MySQL, Postgres, SQL Server and SQLite from a
  full-screen terminal interface that always shows the SQL behind the view.
vendor: VheissuLabs
homepage: https://github.com/VheissuLabs/tql
license: MIT

contents:
  - src: ./dist/tql
    dst: /usr/bin/tql
    file_info:
      mode: 0755

# No dependencies at all: the binary carries its own PHP.
